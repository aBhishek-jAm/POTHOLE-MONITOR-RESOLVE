<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Road Health App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <nav class="nav-bar">
            <span class="nav-title">🛣️ Road Health</span>
            <div class="nav-links">
                <a href="home.html" class="active">Home</a>
                <a href="profile.html">Profile</a>
                <a href="#" id="logout-btn">Logout</a>
            </div>
        </nav>

        <h1>Report Road Issues</h1>

        <!-- Video element for camera stream -->
        <video id="video" autoplay playsinline></video>

        <!-- Buttons for recording -->
        <div class="btn-group">
            <button id="start-record">▶ Start Recording</button>
            <button id="stop-record" disabled>⏹ Stop Recording</button>
        </div>

        <!-- Display detection results -->
        <div id="detection-results">
            <p>Press "Start Recording" to begin detecting road issues.</p>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
