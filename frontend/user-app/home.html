<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Road Health App</title>
    <link rel="stylesheet" href="style.css">
    <!-- Load Roboflow Inference library (if needed) -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/@roboflow/inference@0.1.0/dist/inference.min.js"></script> -->
</head>
<body>
    <div class="container">
        <h1>Report Road Issues</h1>
        <!-- Video element for camera stream -->
        <video id="video" autoplay playsinline></video>
        <!-- Buttons for recording -->
        <button id="start-record">Start Recording</button>
        <button id="stop-record" disabled>Stop Recording</button>
        <!-- Display detection results -->
        <div id="detection-results"></div>
    </div>

    <!-- Load your custom script -->
    <script src="scripts.js"></script>
</body>
</html>
