<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Road Health App</title>
    <link rel="stylesheet" href="pstyles.css">
</head>
<body>
    <div class="container">
        <nav class="nav-bar">
            <span class="nav-title">🛣️ Road Health</span>
            <div class="nav-links">
                <a href="home.html">Home</a>
                <a href="profile.html" class="active">Profile</a>
                <a href="#" id="logout-btn">Logout</a>
            </div>
        </nav>

        <h1>User Profile</h1>
        <div class="profile-section">
            <div class="profile-picture">
                <img id="profile-image" src="https://ui-avatars.com/api/?name=User&background=28a745&color=fff&size=100" alt="Profile Picture">
                <input type="file" id="upload-photo" accept="image/*">
            </div>
            <div class="profile-details">
                <p><strong>Email:</strong> <span id="user-email">Loading...</span></p>
                <p><strong>Phone:</strong> <span id="user-phone">Loading...</span></p>
                <p><strong>Date of Birth:</strong> <input type="date" id="user-dob"></p>
                <p><strong>Bio:</strong> <textarea id="user-bio" rows="3" placeholder="Tell us about yourself..."></textarea></p>
                <button id="update-profile">Update Profile</button>
            </div>
        </div>
        <div class="stats-section">
            <h2>Your Stats</h2>
            <p><strong>Total Faults Found:</strong> <span id="total-faults">0</span></p>
            <p><strong>Verified by Officials:</strong> <span id="verified-faults">0</span></p>
            <p><strong>Total Reward Points:</strong> <span id="total-points">0</span></p>
            <p><strong>Today's Earnings:</strong> <span id="todays-earnings">0</span></p>
        </div>
    </div>
    <script src="pscript.js"></script>
</body>
</html>
